<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>ToDo List</title>
</head>

<body>
    <div class="left-container">
        <h1>Put your task</h1>
        <form action="">
            <div class="input-area">
                <label class="label" for="input-name">Task</label>
                <input type="text" id="input-name" placeholder="Task name">
            </div>
            <div class="input-area">
                <label class="label" for="input-description">Description</label>
                <input type="text" id="input-description" placeholder="Task description">
            </div>
            <div class="row-div">
                <div class="input-area">
                    <label class="label" for="input-date">Due date</label>
                    <input type="date" id="input-date" placeholder="Task date">
                </div>
                <div class="input-area">
                    <p class="label" for="task-status">Status</p>
                    <div class="dropbox-container">
                        <button class="dropbox-btn" id="dropbox-btn">Select</button>
                        <ul class="status-list" id="dropbox-list">
                            <li>Pending</li>
                            <li>In Progress</li>
                            <li>Completed</li>
                        </ul>
                    </div>

                </div>
            </div>
            <button type="submit" class="submit" id="submit">Add Task</button>
        </form>
    </div>
    <div class="right-container">
        <h1>Tasks</h1>
        <div class="list-container" id="list-task">

        </div>
    </div>
</body>

</html>
