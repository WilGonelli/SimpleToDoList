<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>ToDo List</title>
</head>

<body>
    <div class="left-container">
        <h1>Put your task</h1>
        <form action="">
            <div class="input-area">
                <label class="label" for="input-name">Task</label>
                <input type="text" id="input-name" placeholder="Task name">
            </div>
            <div class="input-area">
                <label class="label" for="input-description">Description</label>
                <input type="text" id="input-description" placeholder="Task description">
            </div>
            <button type="submit" class="submit" id="submit">Add Task</button>
        </form>
    </div>
    <div class="right-container">
        <h1>Tasks</h1>
        <ul class="list-container" id="list-task">
        </ul>
    </div>
</body>

</html>
