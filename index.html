<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>ToDo List</title>
</head>

<body>
    <div class="left-container">
        <h1>Put your task</h1>
        <form action="">
            <div class="input-area">
                <label for="task-name">Task</label>
                <input type="text" name="task-name" id="task-name" placeholder="Task name">
            </div>
            <div class="input-area">
                <label for="task-description">Description</label>
                <input type="text" description="task-description" id="task-description" placeholder="Task description">
            </div>
            <div class="row-div">
                <div class="input-area">
                    <label for="task-date">Due date</label>
                    <input type="date" date="task-date" id="task-date"
                        placeholder="Task date">
                </div>
                <div class="input-area">
                    <label for="task-status">Status</label>
                    <div class="dropbox-container">
                        <button class="dropbox-btn">Select</button>
                        <ul class="not-show">
                            <li><a href="#">Pending</a></li>
                            <li><a href="#">In Progress</a></li>
                            <li><a href="#">Completed</a></li>
                        </ul>
                    </div>
                    
                </div>
            </div>
            <button type="submit" class="submit">Add Task</button>
        </form>
    </div>
    <div class="right-container">list</div>
</body>
</html>
